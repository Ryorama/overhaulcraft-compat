plugins {
    id "dev.architectury.loom" version "1.9-SNAPSHOT" apply false
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

version = '1.0'
group = 'com.ryorama.tstp_content'

allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"
    apply plugin: "dev.architectury.loom"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        }
        maven {
            url 'https://maven.teamresourceful.com/repository/maven-public/'
        }
        maven {
            url "https://cursemaven.com"
        }
        maven {
            name = "Valkyrien Skies Internal"
            url = 'https://maven.valkyrienskies.org'
        }
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
        maven {
            url "https://maven.tterrag.com/"
        }
        maven { url "https://maven.shedaniel.me/" }
        maven {
            url = "https://maven.theillusivec4.top/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name "Modding Legacy Maven"
            url "https://maven.moddinglegacy.com/maven"
        }
        maven {
            url = "https://maven.realrobotix.me/master/"
            content {
                includeGroup("com.rbasamoyai")
            }
        }
        maven {
            name = "Illusive Soulworks maven"
            url = "https://maven.theillusivec4.top/"
        }
        maven { url = "https://maven.bawnorton.com/releases" }
        maven { url = "https://maven.su5ed.dev/releases" }
        mavenLocal()
    }

    dependencies {
        minecraft "com.mojang:minecraft:1.20.1"
    }
}


def generatedResources = file("src/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    silentMojangMappingsLicense()
    forge {
        mixinConfig "tstp_content.mixins.json"
    }
    mixin {
        defaultRefmapName.set("tstp_content.mixins.refmap.json")
    }
    runs {
        client {
            client()
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        server {
            server()
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        data {
            data()
            programArgs "--all", "--mod", mod_id
            programArgs "--output", generatedResources.absolutePath
        }
        configureEach {
            property "mixin.debug", "true"
            property "mixin.debug.export.decompile", "false"
            property "mixin.debug.verbose", "true"
            property "mixin.dumpTargetOnFailure", "true"
            property "mixin.checks", "true"
            property "mixin.hotSwap", "true"
        }
    }
}
    
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:1.20.1-47.3.10"
    mappings loom.officialMojangMappings()

    //Forge mods
    modImplementation("com.ryorama.terrariamod:terrariamod:1.0.0")
