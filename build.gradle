plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

version = '1.0'
group = 'com.ryorama.tstp_content'

allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"
    apply plugin: "dev.architectury.loom"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    repositories {
        mavenLocal()
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url "https://maven.blamejared.com/"  }
        maven { url "https://modmaven.dev" }
        maven { url "https://maven.ithundxr.dev/snapshots" }
        maven { url "https://maven.teamresourceful.com/repository/maven-public/" }
        maven { url "https://maven.createmod.net" }
        maven { url "https://cursemaven.com" }
        maven { url "https://thedarkcolour.github.io/KotlinForForge/"  }
        maven { url "https://maven.tterrag.com/" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.theillusivec4.top/" }
        maven { url "https://maven.moddinglegacy.com/maven" }
        maven { url "https://maven.realrobotix.me/master/" }
        maven { url "https://maven.theillusivec4.top/" }
        maven { url "https://maven.wispforest.io" }
        maven { url "https://maven.bawnorton.com/releases" }
        maven { url "https://maven.su5ed.dev/releases" }
        maven { url "https://jitpack.io" }
        maven { url "https://maven.confluence.ink/releases" }
        maven {
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:$project.minecraft_version"
    }
}


def generatedResources = file("src/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    silentMojangMappingsLicense()
    runs {
        client {
            client()
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        server {
            server()
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        data {
            data()
            programArgs "--all", "--mod", mod_id
            programArgs "--output", generatedResources.absolutePath
        }
        configureEach {
            property "mixin.debug", "true"
            property "mixin.debug.export.decompile", "false"
            property "mixin.debug.verbose", "true"
            property "mixin.dumpTargetOnFailure", "true"
            property "mixin.checks", "true"
            property "mixin.hotSwap", "true"
        }
    }
}
    
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    flatDir {
        dirs 'libs'
    }

}
dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"
    mappings loom.officialMojangMappings()

    modImplementation("org.sinytra:connector:2.0.0-beta.7+1.21.1")
    modImplementation("org.sinytra.forgified-fabric-api:forgified-fabric-api:0.115.6+2.1.1+1.21.1")
    modImplementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    modImplementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    modImplementation("org.confluence.mod:ConfluenceOtherworld:${confluence_version}")
    modImplementation("org.confluence.lib:Confluence-Magic-Lib:${confluence_lib_version}")
    modImplementation("org.confluence:TerraEntity:${terra_entity_version}")
    modImplementation("org.confluence:TerraFurniture:${minecraft_version}-${terra_furniture_version}")
    modImplementation("org.confluence:TerraGuns:${minecraft_version}-${terra_guns_version}")
    modImplementation("org.confluence:TerraEntity:${terra_entity_version}")
    modImplementation("com.xiaohunao:xhn_lib:1.21.1-${xhn_lib_version}")
    modImplementation("com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}")
    modImplementation("nowebsite.makertechno:TheTrackers:${minecraft_version}-${trackers_version}")
    modImplementation("org.mesdag:ParticleStorm:${particle_storm_version}")
    modImplementation("org.mesdag.thr_dim_particle:ThreeDimensionParticle-core:${tdpc_version}")

    modImplementation('curse.maven:framework-549225:6531439')
    modImplementation('curse.maven:refurbished-furniture-897116:6623948')
    modImplementation('curse.maven:potionsmaster-356801:6826199')
    modImplementation('curse.maven:cuisine-delight-893541:6677783')
    modImplementation('curse.maven:farmers-delight-398521:6597295')
    modImplementation('curse.maven:architectury-api-419699:5786327')
    modImplementation('curse.maven:butchery-973620:6668101')
    modImplementation('curse.maven:randomium-ore-523013:6659375')
    modImplementation('curse.maven:configuration-444699:6779573')
    modImplementation('curse.maven:deeperdarker-659011:6463247')
    modImplementation('curse.maven:mekanism-268560:6895130')
    modImplementation('curse.maven:easy-villagers-400514:6831416')
    modImplementation('curse.maven:ato-405593:6799475')
    modImplementation('curse.maven:aether-255308:6389857')
    modImplementation('curse.maven:the-twilight-forest-227639:6472889')
    modImplementation('curse.maven:astral-dimension-645743:7333713')
    modImplementation('curse.maven:the-undergarden-379849:7367597')
    modImplementation('curse.maven:thirst-was-taken-679270:6759289')
    modImplementation('curse.maven:ex-deorum-901420:6614749')
    modImplementation('curse.maven:cloth-config-348521:5729127')
    modImplementation('curse.maven:ftb-quests-forge-289412:6829025')
    modImplementation('curse.maven:ftb-library-forge-404465:6807431')
    modImplementation('curse.maven:melody-938643:5453382')
    modImplementation('curse.maven:confluence-dimension-patch-1308724:7523135')
    modImplementation('maven.modrinth:pizzadelight:1.21.1-2.0.2')

    //Fabric mods
    runtimeOnly(project("mod-bridge"))
    api(include(project("mod-bridge"))) { transitive = false }
    implementation(project("mod-bridge")) { targetConfiguration = "modRuntimeClasspathMainMapped" }

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3"))
    implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.3"))
    include(implementation("com.moulberry:mixinconstraints:1.0.9"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}