    //Fabric mods
    runtimeOnly(project("mod-bridge"))
    api(include(project("mod-bridge"))) { transitive = false }
    implementation(project("mod-bridge")) { targetConfiguration = "modRuntimeClasspathMainMapped" }

    //Extra Stuff
    implementation(include("dev.xkmc.l2library:l2library:2.4.14-slim"))
    implementation(include("dev.xkmc.l2serial:l2serial:1.2.0"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))
    implementation("org.valkyrienskies.core:api:${vs_core_version}")
    implementation("org.valkyrienskies.core:impl:${vs_core_version}")
    implementation("org.valkyrienskies.core:api-game:${vs_core_version}")
    implementation("org.valkyrienskies.core:util:${vs_core_version}")
    implementation('thedarkcolour:kotlinforforge:4.10.0')

    modImplementation("top.theillusivec4.curios:curios-forge:5.11.0+1.20.1")
    modImplementation("top.theillusivec4.curios:curios-forge:5.11.0+1.20.1:api")
    modImplementation(include("com.tterrag.registrate:Registrate:MC1.20-1.3.3"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.2.0"))
    implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.2.0"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}